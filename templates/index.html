<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Traffic Command</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
        .dashboard { display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; margin-top: 20px; }
        .video-container { background: #1e1e1e; padding: 15px; border-radius: 10px; border: 2px solid #333; height: fit-content; }
        .video-container img { max-width: 600px; border-radius: 5px; }
        
        /* THE MAP STYLES */
        .map-container { background: #1e1e1e; padding: 20px; border-radius: 10px; border: 2px solid #333; width: 400px; display: flex; flex-direction: column; align-items: center; }
        
        .road-container { position: relative; width: 300px; height: 350px; margin-top: 20px; }
        
        /* The Roads */
        .road { position: absolute; background-color: #333; display: flex; justify-content: center; align-items: center; transition: background-color 0.5s ease; border: 2px dashed #666; }
        .road-text { font-weight: bold; background: rgba(0,0,0,0.6); padding: 5px; border-radius: 4px; z-index: 10; }
        
        /* Map Layout (Y-Junction) */
        #road-main { bottom: 0; left: 100px; width: 100px; height: 150px; border-bottom: none; }
        #road-b { top: 0; left: 0; width: 100px; height: 150px; border-top: none; border-left: none; }
        #road-c { top: 0; right: 0; width: 100px; height: 150px; border-top: none; border-right: none; }
        .junction-center { position: absolute; top: 150px; left: 100px; width: 100px; height: 50px; background-color: #333; transition: background-color 0.5s ease; }
        
        /* The Green Corridor Effect */
        .green-corridor { background-color: #004d1a !important; border-color: #00ff66 !important; }
        
        #alert-banner { padding: 15px; border-radius: 5px; font-weight: bold; margin-bottom: 20px; font-size: 1.2em; width: 100%; }
        .normal { background-color: #333; color: #aaa; }
        .emergency { background-color: #ff3333; color: white; animation: flash 1s infinite; }
        @keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }
    </style>
</head>
<body>
    <h1>🚦 Smart City AI Traffic Router</h1>

    <div class="dashboard">
        <div class="video-container">
            <h3>Live YOLOv8 Feed</h3>
            <img src="/video_feed" alt="Video Feed">
        </div>

        <div class="map-container">
            <div id="alert-banner" class="normal">SYSTEM STATUS: NORMAL TRAFFIC</div>
            
            <div class="road-container">
                <div id="road-b" class="road"><span class="road-text">Route B (Hospital)</span></div>
                <div id="road-c" class="road"><span class="road-text">Route C (Civilian)</span></div>
                <div class="junction-center" id="center-box"></div>
                <div id="road-main" class="road"><span class="road-text">Route A (Incoming)</span></div>
            </div>
        </div>
    </div>

    <script>
        function updateTrafficMap(isEmergency) {
            const banner = document.getElementById('alert-banner');
            const roadMain = document.getElementById('road-main');
            const roadB = document.getElementById('road-b');
            const roadC = document.getElementById('road-c');
            const centerBox = document.getElementById('center-box');
            
            if (isEmergency) {
                // EMERGENCY: Create Green Corridor on Route A -> Route B. Leave C normal/blocked.
                banner.innerText = "🚨 EMERGENCY OVERRIDE: CORRIDOR ACTIVE 🚨";
                banner.className = "emergency";
                
                roadMain.classList.add('green-corridor');
                roadB.classList.add('green-corridor');
                centerBox.classList.add('green-corridor');
                roadC.classList.remove('green-corridor');
            } else {
                // NORMAL: Remove Green Corridor
                banner.innerText = "SYSTEM STATUS: NORMAL TRAFFIC";
                banner.className = "normal";
                
                roadMain.classList.remove('green-corridor');
                roadB.classList.remove('green-corridor');
                centerBox.classList.remove('green-corridor');
                roadC.classList.remove('green-corridor');
            }
        }

        setInterval(() => {
            fetch('/status')
                .then(response => response.json())
                .then(data => updateTrafficMap(data.ambulance_detected))
                .catch(err => console.error("API Error:", err));
        }, 500);
    </script>
</body>
</html>
