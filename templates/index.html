<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Traffic Command</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: white; margin: 0; padding: 20px; text-align: center; }
        .dashboard { display: flex; justify-content: center; flex-wrap: wrap; gap: 40px; margin-top: 20px; }
        
        .video-container { background: #1e1e1e; padding: 15px; border-radius: 10px; border: 2px solid #333; height: fit-content; }
        .video-container img { max-width: 600px; border-radius: 5px; }
        
        .map-container { background: #1e1e1e; padding: 20px; border-radius: 10px; border: 2px solid #333; width: 450px; }
        
        /* The Dispatch Panel */
        .dispatch-panel { background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .dispatch-btn { background: #444; color: white; border: 1px solid #666; padding: 10px 15px; margin: 5px; border-radius: 5px; cursor: pointer; transition: 0.3s; font-weight: bold;}
        .dispatch-btn.active { background: #0088ff; border-color: #00aaff; box-shadow: 0 0 10px #0088ff; }
        
        #alert-banner { padding: 15px; border-radius: 5px; font-weight: bold; margin-bottom: 20px; transition: 0.5s; }
        .normal { background-color: #333; color: #aaa; }
        .emergency { background-color: #ff3333; color: white; box-shadow: 0 0 20px #ff3333; }

        /* The Smooth 4-Way Map */
        .intersection-wrapper { position: relative; width: 300px; height: 300px; background-color: #1a1a1a; margin: 0 auto; border-radius: 10px; overflow: hidden; }
        
        .road { position: absolute; background-color: #333; display: flex; justify-content: center; align-items: center; transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
        .road span { background: rgba(0,0,0,0.8); padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; z-index: 10; color: #ccc;}
        
        #road-a { width: 80px; height: 110px; left: 110px; top: 0; border-left: 2px dashed #666; border-right: 2px dashed #666; }
        #road-south { width: 80px; height: 110px; left: 110px; bottom: 0; border-left: 2px dashed #666; border-right: 2px dashed #666; }
        #road-c { width: 110px; height: 80px; left: 0; top: 110px; border-top: 2px dashed #666; border-bottom: 2px dashed #666; }
        #road-b { width: 110px; height: 80px; right: 0; top: 110px; border-top: 2px dashed #666; border-bottom: 2px dashed #666; }
        #center-box { position: absolute; width: 80px; height: 80px; left: 110px; top: 110px; background-color: #333; transition: all 0.6s ease; z-index: 5; }

        .green-corridor { background-color: #006622 !important; border-color: #00ff66 !important; box-shadow: inset 0 0 20px #00ff66; }
        .blocked-route { background-color: #220000 !important; border-color: #ff3333 !important; opacity: 0.3; }
    </style>
</head>
<body>
    <h1>🚦 Smart City AI Traffic Controller</h1>
    <div class="dashboard">
        <div class="video-container">
            <h3>Live YOLOv8 Feed</h3>
            <img src="/video_feed" alt="Video Feed">
        </div>

        <div class="map-container">
            <div class="dispatch-panel">
                <h4 style="margin-top:0;">1. Select Ambulance Destination</h4>
                <button class="dispatch-btn" onclick="setRoute('1', this)">ROUTE A</button>
                <button class="dispatch-btn" onclick="setRoute('2', this)">ROUTE B</button>
                <button class="dispatch-btn" onclick="setRoute('3', this)">ROUTE C</button>
            </div>

            <div id="alert-banner" class="normal">SYSTEM STATUS: AWAITING DISPATCH</div>
            
            <div class="intersection-wrapper">
                <div id="road-a" class="road"><span>Route A</span></div>
                <div id="road-c" class="road"><span>Route C</span></div>
                <div id="center-box"></div>
                <div id="road-b" class="road"><span>Route B</span></div>
                <div id="road-south" class="road"><span>Incoming</span></div>
            </div>
        </div>
    </div>

    <script>
        let currentRoute = null;

        function setRoute(routeId, btnElement) {
            currentRoute = routeId;
            document.querySelectorAll('.dispatch-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            
            fetch('/set_target_route', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ route: routeId })
            });
        }

        function updateTrafficMap(data) {
            const banner = document.getElementById('alert-banner');
            const rA = document.getElementById('road-a');
            const rB = document.getElementById('road-b');
            const rC = document.getElementById('road-c');
            const rSouth = document.getElementById('road-south');
            const center = document.getElementById('center-box');
            
            if (!data.route_selected) {
                banner.innerText = "SYSTEM STATUS: AWAITING DISPATCH";
                banner.className = "normal";
                return;
            }

            // Reset all roads
            [rA, rB, rC, rSouth, center].forEach(el => {
                el.classList.remove('green-corridor', 'blocked-route');
            });

            if (data.ambulance_detected) {
                // Map the ID back to a letter for the display banner
                let routeLetter = data.target_route === '1' ? 'A' : (data.target_route === '2' ? 'B' : 'C');
                banner.innerText = `🚨 OVERRIDE: CLEARING ROUTE ${routeLetter} 🚨`;
                banner.className = "emergency";
                
                rSouth.classList.add('green-corridor');
                center.classList.add('green-corridor');
                
                rA.classList.add('blocked-route');
                rB.classList.add('blocked-route');
                rC.classList.add('blocked-route');

                if (data.target_route === '1') rA.classList.replace('blocked-route', 'green-corridor');
                if (data.target_route === '2') rB.classList.replace('blocked-route', 'green-corridor');
                if (data.target_route === '3') rC.classList.replace('blocked-route', 'green-corridor');
                
            } else {
                banner.innerText = "SYSTEM STATUS: NORMAL TRAFFIC";
                banner.className = "normal";
            }
        }

        setInterval(() => {
            fetch('/status')
                .then(res => res.json())
                .then(data => updateTrafficMap(data));
        }, 500);
    </script>
</body>
</html>
